resources:
  pipelines:
    nyctaxi_pipeline:
      name: nyctaxi_pipeline
      # Free Edition はサーバーレス実行のみ
      serverless: true
      catalog: workspace
      schema: nyctaxi
      libraries:
        # nyctaxi_pipeline.py と transforms.py（変換ロジック）をまとめて配置する。
        # 同じディレクトリに置くことで nyctaxi_pipeline.py から
        # `from transforms import ...` として通常の Python import で参照できる。
        - glob:
            include: ../pipelines/*.py
