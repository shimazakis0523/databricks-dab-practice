resources:
  model_serving_endpoints:
    gold_qa_agent_endpoint:
      name: gold_qa_agent
      config:
        served_entities:
          - entity_name: workspace.nyctaxi.gold_qa_agent
            # notebooks/register_gold_qa_agent.py を実行するたびに新しい
            # バージョンが登録される。実行後に表示される Version の値へ
            # databricks.yml の variables.gold_qa_agent_model_version を
            # 更新して再デプロイすること。
            entity_version: "${var.gold_qa_agent_model_version}"
            workload_size: Small
            scale_to_zero_enabled: true
            environment_vars:
              # いずれもワークスペースごとに異なる値、またはシークレットの
              # ため、コードに直書きせず変数/シークレット参照で渡す。
              DATABRICKS_HOST: "${var.agent_databricks_host}"
              DATABRICKS_TOKEN: "{{secrets/${var.agent_secret_scope}/databricks_token}}"
              GOLD_QA_FOUNDATION_MODEL_ENDPOINT: "${var.gold_qa_foundation_model_endpoint}"
