resources:
  volumes:
    nyctaxi_landing:
      name: landing
      catalog_name: workspace
      # nyctaxi_pipeline.yml と同じく文字列で直接参照する。
      # bundle 管理の schemas リソースにすると mode: development によって
      # スキーマ名が "dev_<user>_nyctaxi" にリネームされ、パイプライン側の
      # 文字列参照 "nyctaxi" とずれてしまうため、あえてバンドル管理にしない。
      # スキーマ自体は nyctaxi_pipeline の初回実行時に自動作成される。
      schema_name: nyctaxi
      volume_type: MANAGED
      comment: >-
        外部システムが CSV を配置するランディングゾーン。
        Auto Loader (nyctaxi_pipeline の trips_bronze) がここを増分で取り込む。
