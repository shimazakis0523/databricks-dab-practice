name: Deploy Databricks Bundle

# main への push で dev ターゲットへ自動デプロイする。
# Pull Request では test / validate のみ実行し、実際のデプロイは行わない。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest tests/ -v

  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        working-directory: .
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t dev

  deploy:
    name: Deploy to dev
    needs: [test, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        # CI は非対話環境のため、スキーマ/Volume の削除・再作成などを伴う破壊的な
        # 変更があっても確認プロンプトを出せず失敗する。--auto-approve でそれを自動承認し、
        # デプロイが止まらないようにする（この bundle はサンプル/学習用データのみを扱う前提）。
        run: databricks bundle deploy -t dev --auto-approve

      - name: Ensure workspace groups
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        # resources/groups.txt に列挙したグループを、なければ作成する。
        # Free Edition にはアカウントコンソール/SCIM 同期がないため、
        # ワークスペースの SCIM Groups API を Databricks CLI 経由で叩いている
        # （手動での Add group クリックを不要にするための自動化）。
        run: ./scripts/ensure_groups.sh
