name: Deploy Databricks Bundle

# main への push で dev ターゲットへ自動デプロイする。
# Pull Request では test / validate のみ実行し、実際のデプロイは行わない。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: pytest tests/ -v

  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        working-directory: .
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t dev

  deploy:
    name: Deploy to dev
    needs: [test, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        # CI は非対話環境のため、スキーマ/Volume の削除・再作成などを伴う破壊的な
        # 変更があっても確認プロンプトを出せず失敗する。--auto-approve でそれを自動承認し、
        # デプロイが止まらないようにする（この bundle はサンプル/学習用データのみを扱う前提）。
        run: databricks bundle deploy -t dev --auto-approve

      - name: Ensure workspace groups and entitlements
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        # resources/groups.json に列挙したグループを作成し、entitlements を同期する。
        # Free Edition にはアカウントコンソール/SCIM 同期がないため、
        # ワークスペースの SCIM Groups API を直接呼び出している
        # （手動での Add group クリック・ユーザーごとの Entitlements トグルを
        # 不要にし、グループ経由の継承だけでガバナンスを一本化するための自動化）。
        run: python3 scripts/ensure_groups.py

      - name: Audit groups not declared in IaC (report only for now)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        # resources/groups.json に無いグループは「あってはならない存在」として
        # 検知する。ただし admins / users は Databricks のシステム予約グループ
        # として常に保護する（スクリプト内でハードコード）。
        # 現状は --dry-run（検知のみ・実削除なし）で運用している。実削除を
        # 有効にする場合は --dry-run を外すこと（README/CLAUDE.md 参照）。
        run: python3 scripts/audit_undeclared_groups.py --dry-run

      - name: Audit direct user entitlements (report only)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        # グループ経由ではない、ユーザーへの直接 entitlements 付与を検知して
        # ログに出す（自動修正はしない。誤検知でオーナー自身の権限を
        # 落とさないよう、このステップは常に成功扱いにする）。
        run: python3 scripts/audit_user_entitlements.py
